[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wbc-multistream-cnn"
version = "0.1.0"
description = "Three-stream CNN with gated feature fusion for white-blood-cell classification"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rashi Chauhan" }]
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16,<2.20",
    "numpy",
    "opencv-python-headless",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]  # original notebooks are kept unmodified

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
